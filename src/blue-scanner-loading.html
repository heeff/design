<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>蓝色扫描灯 Loading - 模块自适应版</title>

        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #08101d;
                color: #d7e8ff;
                font-family: Arial, 'Microsoft YaHei', sans-serif;
            }

            .demo-wrap {
                width: min(100%, 1100px);
            }

            .demo-title {
                margin: 0 0 14px;
                font-size: 18px;
                font-weight: 600;
                color: #dceaff;
            }

            .demo-desc {
                margin: 0 0 18px;
                font-size: 13px;
                line-height: 1.7;
                color: rgba(205, 225, 255, 0.78);
            }

            .module-demo {
                width: min(100%, 760px);
                height: 280px;
                min-width: 320px;
                min-height: 160px;
                resize: both;
                overflow: auto;
                border: 1px solid rgba(120, 180, 255, 0.18);
                border-radius: 18px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0) 30%), #0b1426;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 12px 30px rgba(0, 0, 0, 0.28);
            }

            .loading-module {
                width: 100%;
                height: 100%;
                padding: clamp(14px, 4%, 28px);
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0b1426;
                container-type: size;
            }

            .loading-box {
                width: min(88cqw, 720px);
                max-width: 100%;
                text-align: center;
            }

            .scanner-shell {
                position: relative;
                width: 100%;
                height: clamp(28px, min(8cqh, 7cqw), 52px);
                padding: clamp(4px, min(1.2cqh, 1cqw), 7px);
                overflow: hidden;
                border: 1px solid rgba(160, 215, 255, 0.3);
                border-radius: 999px;
                background: linear-gradient(
                        180deg,
                        rgba(255, 255, 255, 0.11) 0%,
                        rgba(170, 225, 255, 0.04) 28%,
                        rgba(4, 12, 24, 0.8) 68%,
                        rgba(120, 180, 255, 0.04) 100%
                    ),
                    #08111f;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(120, 190, 255, 0.08),
                    0 8px 24px rgba(0, 0, 0, 0.45), 0 0 18px rgba(0, 120, 255, 0.08);
            }

            .scanner-shell::before {
                content: '';
                position: absolute;
                inset: 4px;
                pointer-events: none;
                border: 1px solid rgba(190, 230, 255, 0.08);
                border-radius: inherit;
            }

            .scanner-track {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
                border-radius: 999px;
                background: repeating-linear-gradient(
                        90deg,
                        rgba(0, 180, 255, 0.025) 0,
                        rgba(0, 180, 255, 0.025) 12px,
                        transparent 12px,
                        transparent 23px
                    ),
                    linear-gradient(180deg, #030813, #09111d 52%, #030813);
                box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.95), inset 0 0 2px rgba(180, 220, 255, 0.13);
            }

            .ambient-glow {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 42%;
                height: 180%;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                background: rgba(0, 145, 255, 0.15);
                filter: blur(24px);
                animation: ambientPulse 1.6s ease-in-out infinite;
            }

            .scan-light {
                position: absolute;
                top: 50%;
                left: 0;
                width: clamp(62px, 16cqw, 110px);
                height: clamp(8px, min(2.2cqh, 1.8cqw), 12px);
                border-radius: 999px;
                transform: translateY(-50%);
                background: linear-gradient(
                    90deg,
                    rgba(0, 140, 255, 0) 0%,
                    rgba(0, 170, 255, 0.4) 22%,
                    #29b6ff 50%,
                    #ffffff 56%,
                    #38a8ff 63%,
                    rgba(0, 150, 255, 0.28) 82%,
                    rgba(0, 140, 255, 0) 100%
                );
                filter: saturate(1.18);
                box-shadow: 0 0 4px rgba(255, 255, 255, 0.95), 0 0 10px rgba(80, 200, 255, 1),
                    0 0 24px rgba(0, 170, 255, 0.95), 0 0 48px rgba(0, 120, 255, 0.55);
                animation: scan 3.1s ease-in-out infinite;
                will-change: left, transform;
            }

            .scan-light::before,
            .scan-light::after {
                content: '';
                position: absolute;
                top: 50%;
                right: 62%;
                transform: translateY(-50%);
                border-radius: 999px;
                background: linear-gradient(90deg, rgba(0, 140, 255, 0), rgba(50, 190, 255, 0.46));
            }

            .scan-light::before {
                width: clamp(90px, 22cqw, 155px);
                height: clamp(5px, min(1.6cqh, 1.3cqw), 8px);
                opacity: 0.54;
                filter: blur(1px);
            }

            .scan-light::after {
                width: clamp(150px, 34cqw, 250px);
                height: clamp(3px, min(1.1cqh, 0.8cqw), 5px);
                opacity: 0.26;
                filter: blur(3px);
            }

            .loading-text {
                margin-top: clamp(16px, 4.6cqh, 34px);
                color: rgba(220, 235, 255, 0.88);
                font-size: clamp(12px, min(2.2cqh, 2.5cqw), 22px);
                font-weight: 300;
                letter-spacing: clamp(0.12em, 0.28cqw, 0.32em);
                text-transform: uppercase;
                text-shadow: 0 0 8px rgba(255, 255, 255, 0.08), 0 0 18px rgba(0, 150, 255, 0.18);
                white-space: nowrap;
            }

            .loading-text .dots {
                display: inline-block;
                width: 2.2em;
                text-align: left;
            }

            .loading-text .dots::after {
                content: '';
                animation: dots 1.2s steps(4, end) infinite;
            }

            @keyframes scan {
                0% {
                    left: 0;
                    transform: translate(0, -50%) scaleX(1);
                }

                48% {
                    left: 100%;
                    transform: translate(-100%, -50%) scaleX(1);
                }

                50% {
                    left: 100%;
                    transform: translate(-100%, -50%) scaleX(-1);
                }

                98% {
                    left: 0;
                    transform: translate(0, -50%) scaleX(-1);
                }

                100% {
                    left: 0;
                    transform: translate(0, -50%) scaleX(1);
                }
            }

            @keyframes ambientPulse {
                0%,
                100% {
                    opacity: 0.42;
                    transform: translate(-50%, -50%) scaleX(0.82);
                }

                50% {
                    opacity: 0.82;
                    transform: translate(-50%, -50%) scaleX(1.08);
                }
            }

            @keyframes dots {
                0% {
                    content: '';
                }

                25% {
                    content: '.';
                }

                50% {
                    content: '..';
                }

                75%,
                100% {
                    content: '...';
                }
            }
        </style>
    </head>

    <body>
        <div class="demo-wrap">
            <h1 class="demo-title">蓝色扫描灯 Loading（模块自适应版）</h1>
            <p class="demo-desc">
                下面这个模块背景就是
                <strong>#0b1426</strong>
                。
                <br />
                你可以拖拽模块右下角来改变宽高，观察 Loading 如何跟着模块尺寸自适应。
            </p>

            <div class="module-demo">
                <div class="loading-module">
                    <div class="loading-box" aria-label="正在加载">
                        <div class="scanner-shell">
                            <div class="scanner-track">
                                <div class="ambient-glow"></div>
                                <div class="scan-light"></div>
                            </div>
                        </div>

                        <div class="loading-text">
                            Loading
                            <span class="dots"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
