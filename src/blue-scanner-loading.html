<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蓝色扫描灯 Loading - 扁平化模块自适应版</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #08101d;
            color: #d7e8ff;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .demo-wrap {
            width: min(100%, 1100px);
        }

        .demo-title {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: 600;
            color: #dceaff;
        }

        .demo-desc {
            margin: 0 0 18px;
            font-size: 13px;
            line-height: 1.7;
            color: rgba(205, 225, 255, 0.78);
        }

        .module-demo {
            width: min(100%, 760px);
            height: 280px;
            min-width: 320px;
            min-height: 160px;
            resize: both;
            overflow: auto;
            border: 1px solid rgba(120, 180, 255, 0.18);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0) 28%),
                #0b1426;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.025),
                0 12px 30px rgba(0, 0, 0, 0.22);
        }

        .loading-module {
            width: 100%;
            height: 100%;
            padding: clamp(14px, 4%, 28px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1426;
            container-type: size;
        }

        .loading-box {
            width: min(88cqw, 720px);
            max-width: 100%;
            text-align: center;
        }

        .scanner-shell {
            position: relative;
            width: 100%;
            height: clamp(24px, min(7cqh, 6.4cqw), 42px);
            padding: clamp(3px, min(0.9cqh, 0.8cqw), 5px);
            overflow: hidden;
            border: 1px solid rgba(120, 190, 255, 0.24);
            border-radius: 999px;
            background: linear-gradient(
                180deg,
                rgba(18, 32, 54, 0.96) 0%,
                rgba(10, 21, 38, 0.96) 100%
            );
            box-shadow:
                0 0 0 1px rgba(130, 200, 255, 0.04),
                0 0 16px rgba(0, 120, 255, 0.06);
        }

        .scanner-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border: 1px solid rgba(190, 230, 255, 0.04);
            border-radius: inherit;
        }

        .scanner-track {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 999px;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(0, 180, 255, 0.03) 0,
                    rgba(0, 180, 255, 0.03) 10px,
                    transparent 10px,
                    transparent 20px
                ),
                linear-gradient(180deg, #071120, #081425);
            box-shadow:
                inset 0 0 0 1px rgba(170, 220, 255, 0.04),
                inset 0 0 10px rgba(0, 0, 0, 0.35);
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 42%;
            height: 150%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(0, 145, 255, 0.12);
            filter: blur(18px);
            animation: ambientPulse 1.6s ease-in-out infinite;
        }

        .scan-light {
            position: absolute;
            top: 50%;
            left: 0;
            width: clamp(62px, 16cqw, 110px);
            height: clamp(7px, min(1.8cqh, 1.5cqw), 10px);
            border-radius: 999px;
            transform: translateY(-50%);
            background: linear-gradient(
                90deg,
                rgba(0, 140, 255, 0) 0%,
                rgba(0, 170, 255, 0.34) 22%,
                #29b6ff 50%,
                #dff5ff 56%,
                #38a8ff 63%,
                rgba(0, 150, 255, 0.22) 82%,
                rgba(0, 140, 255, 0) 100%
            );
            box-shadow:
                0 0 3px rgba(220, 245, 255, 0.75),
                0 0 8px rgba(60, 190, 255, 0.75),
                0 0 18px rgba(0, 150, 255, 0.55);
            animation: scan 3.1s ease-in-out infinite;
            will-change: left, transform;
        }

        .scan-light::before,
        .scan-light::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 62%;
            transform: translateY(-50%);
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(0, 140, 255, 0), rgba(50, 190, 255, 0.40));
        }

        .scan-light::before {
            width: clamp(90px, 22cqw, 155px);
            height: clamp(4px, min(1.3cqh, 1cqw), 6px);
            opacity: 0.42;
            filter: blur(1px);
        }

        .scan-light::after {
            width: clamp(150px, 34cqw, 250px);
            height: clamp(2px, min(0.9cqh, 0.6cqw), 4px);
            opacity: 0.18;
            filter: blur(3px);
        }

        .loading-text {
            margin-top: clamp(14px, 4cqh, 28px);
            color: rgba(220, 235, 255, 0.82);
            font-size: clamp(12px, min(2cqh, 2.2cqw), 20px);
            font-weight: 300;
            letter-spacing: clamp(0.12em, 0.24cqw, 0.28em);
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 150, 255, 0.14);
            white-space: nowrap;
        }

        .loading-text .dots {
            display: inline-block;
            width: 2.2em;
            text-align: left;
        }

        .loading-text .dots::after {
            content: "";
            animation: dots 1.2s steps(4, end) infinite;
        }

        @keyframes scan {
            0% {
                left: 0;
                transform: translate(0, -50%) scaleX(1);
            }

            48% {
                left: 100%;
                transform: translate(-100%, -50%) scaleX(1);
            }

            50% {
                left: 100%;
                transform: translate(-100%, -50%) scaleX(-1);
            }

            98% {
                left: 0;
                transform: translate(0, -50%) scaleX(-1);
            }

            100% {
                left: 0;
                transform: translate(0, -50%) scaleX(1);
            }
        }

        @keyframes ambientPulse {
            0%, 100% {
                opacity: 0.28;
                transform: translate(-50%, -50%) scaleX(0.9);
            }

            50% {
                opacity: 0.55;
                transform: translate(-50%, -50%) scaleX(1.04);
            }
        }

        @keyframes dots {
            0% {
                content: "";
            }

            25% {
                content: ".";
            }

            50% {
                content: "..";
            }

            75%, 100% {
                content: "...";
            }
        }
    </style>
</head>

<body>
    <div class="demo-wrap">
        <div class="module-demo">
            <div class="loading-module">
                <div class="loading-box" aria-label="正在加载">
                    <div class="scanner-shell">
                        <div class="scanner-track">
                            <div class="ambient-glow"></div>
                            <div class="scan-light"></div>
                        </div>
                    </div>

                    <div class="loading-text">
                        Loading
                        <span class="dots"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
